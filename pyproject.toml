[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-guard"
version = "1.0.0"
description = "Deterministic reward-hacking detector for LLM-generated Python code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
authors = [
    { name = "Nick" }
]
keywords = ["ast", "reward-hacking", "llm", "static-analysis", "code-safety", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Nick-is-building/ast-guard"
Repository = "https://github.com/Nick-is-building/ast-guard"
Issues = "https://github.com/Nick-is-building/ast-guard/issues"

[project.scripts]
ast-guard = "ast_guard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
